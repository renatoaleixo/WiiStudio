name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version, for example 1.0.0
        required: true
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - dev
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Build, Test and Package
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      WIISTUDIO_CHANNEL: ${{ inputs.channel || 'stable' }}
      WIISTUDIO_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer version: $version" >&2
            exit 2
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore WiiStudio.sln

      - name: Build
        run: dotnet build WiiStudio.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WiiStudio.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Package
        run: scripts/release/package.sh "${{ steps.version.outputs.version }}"

      - name: Smoke Test Artifacts
        run: scripts/release/smoke-test.sh "${{ steps.version.outputs.version }}"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wiistudio-release-${{ steps.version.outputs.version }}
          path: artifacts/release/${{ steps.version.outputs.version }}/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/release/${VERSION}/* \
            --title "$GITHUB_REF_NAME" \
            --notes "WiiStudio ${GITHUB_REF_NAME}" \
            --verify-tag
