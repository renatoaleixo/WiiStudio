name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore WiiStudio.sln
      - run: dotnet build WiiStudio.sln -c Release --no-restore
      - run: dotnet test WiiStudio.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - run: dotnet list WiiStudio.sln package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
